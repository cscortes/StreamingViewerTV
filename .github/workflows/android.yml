name: Android APK

# Build a sideloadable debug APK on version tags and manual runs only
# (not on every PR — catalog download + Gradle/Chaquopy is heavy).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build IPTV catalog (viewer.db)
        run: make build

      - name: Assemble debug APK
        env:
          CHAQUOPY_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          if [ -z "${CHAQUOPY_PYTHON}" ] || [ ! -x "${CHAQUOPY_PYTHON}" ]; then
            export CHAQUOPY_PYTHON="$(command -v python3.10)"
          fi
          echo "CHAQUOPY_PYTHON=${CHAQUOPY_PYTHON}"
          java -version
          make bundle-android

      - name: Stage release APK name
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            StreamingViewerTV-android-debug.apk
          ls -lh StreamingViewerTV-android-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamingViewerTV-android-debug
          path: StreamingViewerTV-android-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: StreamingViewerTV-android-debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
